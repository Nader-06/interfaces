<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Travellers without borders</title>
    <link rel="stylesheet" href="styles/navbar.css" />
    <link rel="stylesheet" href="styles/registration_form.css" />
    <link rel="stylesheet" href="styles/footer.css" />
</head>
<body>
    <header class="header" id="header">
        <h4>Travellers without borders</h4>

        <nav class="nav" aria-label="Main navigation">
            <a href="homepage.html">Home</a>
            <a href="#">Experiences</a>
            <a href="#">Tips</a>
            <a href="#">Forum</a>
            <a href="#">Contact</a>
        </nav>

        <div class="right_header">
            <img src="images/logo.png" class="logo" id="logo" alt="Travellers without borders logo" />
            <label class="sr-only" for="languages">Select language</label>
            <select name="languages" id="languages" aria-label="Select language">
                <option value="ES">ES</option>
                <option value="EN" selected>EN</option>
            </select>
        </div>
    </header>

    <main class="main">
        <section class="form_container">
            <form class="registration_form" id="registration-form" novalidate>
                <h2>Register</h2>

                <div class="full_name">
                    <div>
                        <label class="sr-only" for="name">First name</label>
                        <input type="text" id="name" placeholder="Name*" required />
                    </div>
                    <div>
                        <label class="sr-only" for="surname">Surnames</label>
                        <input type="text" id="surname" placeholder="Surnames*" required />
                    </div>
                </div>

                <div class="email_address">
                    <div>
                        <label class="sr-only" for="email">Email address</label>
                        <input type="email" id="email" placeholder="Email*" required autocomplete="email" />
                    </div>
                    <div>
                        <label class="sr-only" for="confirm_email">Confirm email</label>
                        <input type="email" id="confirm_email" placeholder="Confirm email*" required autocomplete="email" />
                    </div>
                </div>

                <div class="password_dob">
                    <div>
                        <label class="date_of_birth" for="date_of_birth">Date of birth*</label>
                        <input type="date" id="date_of_birth" required />
                    </div>
                    <div>
                        <label class="sr-only" for="username">Login username</label>
                        <input type="text" id="username" placeholder="Login*" required autocomplete="username" />
                        <label class="sr-only" for="password">Password</label>
                        <input type="password" id="password" placeholder="Password*" required autocomplete="new-password" />
                    </div>
                </div>

                <div class="upload_photo">
                    <label for="photo">Upload your photo*</label>
                    <input type="file" id="photo" accept=".webp,.png,.jpg,.jpeg" required />
                </div>

                <div class="terms_conditions">
                    <label for="privacy-check">
                        <input type="checkbox" id="privacy-check" />
                        I accept the privacy policy*
                    </label>
                </div>

                <div class="signup_login">
                    <button class="signup" id="signup-btn" type="button" disabled>Save data and access</button>
                    <button class="login" id="go-login-btn" type="button">Back to login</button>
                </div>
            </form>
        </section>
    </main>

    <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-message">
        <div id="modal-box">
            <p id="modal-message"></p>
            <div class="modal-actions">
                <button id="modal-confirm" class="hidden" type="button">Confirm</button>
                <button id="modal-cancel" class="hidden" type="button">Cancel</button>
                <button id="modal-ok" type="button">OK</button>
            </div>
        </div>
    </div>

    <footer class="footer" id="footer">
        <div class="left_footer">
            <p class="copyright">© 2025 Travellers without borders</p>
        </div>
        <div class="center_footer">
            <a class="details" href="https://policies.google.com/privacy?hl=en-US" target="_blank" rel="noopener">Privacy Policy</a>
            <a class="details" href="https://usercentrics.com/guides/terms-of-service/" target="_blank" rel="noopener">Terms of Service</a>
            <a class="details" href="https://www.website.com/contact-us/" target="_blank" rel="noopener">Contact Us</a>
            <a class="details" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1" target="_blank" rel="noopener">About Us</a>
        </div>
        <div class="right_footer">
            <a class="facebook" href="https://www.facebook.com/?locale=es_LA" target="_blank" rel="noopener">
                <img src="images/facebook.png" class="facebook" id="facebook" alt="Facebook" />
            </a>
            <a class="instagram" href="https://www.instagram.com/" target="_blank" rel="noopener">
                <img src="images/instagram.jpeg" class="instagram" id="instagram" alt="Instagram" />
            </a>
            <a class="twitter" href="https://x.com/?lang=es" target="_blank" rel="noopener">
                <img src="images/twitter.jpg" class="twitter" id="twitter" alt="Twitter" />
            </a>
        </div>
    </footer>

    <script src="js/registration_form.js" defer></script>
</body>
</html>
