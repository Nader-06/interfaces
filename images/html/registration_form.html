<html>
    <head>
        <link rel="stylesheet" href="../styles/navbar.css">
        <link rel="stylesheet" href="../styles/registration_form.css">
        <link rel="stylesheet" href="../styles/footer.css">
        <title>Travellers without borders</title>

    </head>

    <body>
        <header class="header" id="header">
            <h4>Travellers without borders</h4>

            <nav class="nav">
                <a href="../html/homepage.html">Home</a>
                <a href="../html/experiences.html">Experiences</a>
                <a href="../html/tips.html">Tips</a>
                <a href="../html/forum.html">Forum</a>
                <a href="../html/contact.html">Contact</a>
            </nav>

            <div class="right_header">
                <img src="../images/logo.png" class="logo" id="logo">
                <select name="languages" id="languages">
                    <option value="ES">ES</option>
                    <option value="EN">EN</option>
                </select>
            </div>
        </header>

    <main class="main">
        <section class="form_container">
            <form class="registration_form" id="registration-form" novalidate>
                <h2>Register</h2>

                <div class="full_name">       
                    <input type="text" id="name" placeholder="name*" required>
                    <input type="text" id="surname" placeholder="surname(s)*" required>
                </div>

                <div class="email_address">                
                    <input type="email" id="email" placeholder="email*" required>
                    <input type="email" id="confirm_email" placeholder="confirm email*" required>
                </div>

                <div class="password_dob">
                    <div>
                        <label class="date_of_birth" for="date_of_birth">Date Of Birth</label>
                        <input type="date" id="date_of_birth" required>
                    </div>
                    <div>
                        <!-- Login username (min 5 chars) -->
                        <input type="text" id="username" placeholder="login username*" required>
                        <!-- Password with rules -->
                        <input type="password" id="password" placeholder="password*" required>
                    </div>
                </div>

                <div class="upload_photo">
                    <label class="upload_photo">Upload your photo*</label>
                    <input type="file" id="photo" accept=".webp,.png,.jpg,.jpeg" required>
                </div>

                <div class="terms_conditions">
                    <label>
                        <input type="checkbox" id="privacy-check">
                        I accept the terms & conditions / privacy policy*
                    </label>
                </div>

                <div class="signup_login">
                    <button class="signup" id="signup-btn" type="button" disabled>Sign Up and save data</button>
                    <button class="login" id="go-login-btn" type="button">Log in</button>
                </div>
            </form>
        </section>
    </main>

    <div id="modal-overlay" class="hidden">
        <div id="modal-box">
            <p id="modal-message"></p>
            <div class="modal-actions">
                <button id="modal-confirm" class="hidden">Confirm</button>
                <button id="modal-cancel" class="hidden">Cancel</button>
                <button id="modal-ok" class="">OK</button>
            </div>
        </div>
    </div>

    <script src="../js/registration_form.js"></script>

        <footer class="footer" id="footer">
            <div class="left_footer">
                <p class="copyright">© 2025 Travellers without borders</p>
            </div>
            <div class="center_footer">
                <a class="details" href="https://policies.google.com/privacy?hl=en-US">Privacy Policy</a>
                <a class="details" href="https://usercentrics.com/guides/terms-of-service/">Terms of Service</a>
                <a class="details" href="https://www.website.com/contact-us/">Contact Us</a>
                <a class="details" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1">About Us</a>
            </div>
            <div class="right_footer">
                <a class="facebook" href="https://www.facebook.com/?locale=es_LA"><img src="../images/facebook.png" class="facebook" id="facebook"></a>
                <a class="instagram" href="https://www.instagram.com/"><img src="../images/instagram.jpeg" class="instagram" id="instagram"></a>
                <a class="twitter" href="https://x.com/?lang=es"><img src="../images/twitter.jpg" class="twitter" id="twitter"></a>
        </footer>
    </body>
</html>
